<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Stack</title>
<style>
:root{
  --bg:#11202b; --panel:#182d3b; --line:#2b465a; --ink:#e9f0f3; --mute:#8fa7b6;
  --light:#e6ecef; --dark:#6f8ea3; --gold:#f0b429; --danger:#ff7a6b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:700;margin:0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:.6rem 1rem;border-radius:6px}
button:hover{border-color:var(--gold)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:var(--gold);color:#1b1500;border-color:var(--gold);font-weight:600}
input{font:inherit;width:100%;padding:.65rem .8rem;border-radius:6px;border:1px solid var(--line);background:#0d1a23;color:var(--ink);margin-top:.3rem}
.hidden{display:none!important}

/* login */
#auth{min-height:100vh;display:grid;place-items:center;padding:1.5rem}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1.8rem}
.card h1{font-size:2rem;margin-bottom:.3rem}
.card p{color:var(--mute);margin:.2rem 0 1.2rem}
.card label{display:block;margin-top:.9rem;color:var(--mute);font-size:.9rem}
.row{display:flex;gap:.6rem;margin-top:1.2rem}
.row button{flex:1}
#msg{min-height:1.4rem;margin-top:.9rem;color:var(--danger);font-size:.92rem}

/* game */
header{display:flex;flex-wrap:wrap;gap:.6rem 1.4rem;align-items:center;justify-content:space-between;padding:.9rem 1.2rem;border-bottom:1px solid var(--line);background:var(--panel)}
header h2{font-size:1.3rem}
.stats{display:flex;gap:1.2rem;color:var(--mute);font-size:.95rem;flex-wrap:wrap}
.stats b{color:var(--ink)}
main{display:flex;flex-wrap:wrap;gap:1.4rem;justify-content:center;padding:1.4rem}
#board{--bs:min(92vw,560px);width:var(--bs);height:var(--bs);display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border:3px solid var(--line);border-radius:4px;user-select:none}
.sq{position:relative;display:grid;place-items:center;cursor:pointer;overflow:hidden;min-width:0;min-height:0;font-size:calc(var(--bs) / 8 * .72);line-height:1}
.sq.l{background:var(--light)} .sq.d{background:var(--dark)}
.sq.last{box-shadow:inset 0 0 0 100px rgba(240,180,41,.28)}
.sq.sel{box-shadow:inset 0 0 0 4px var(--gold)}
.sq.chk{box-shadow:inset 0 0 0 100px rgba(255,90,70,.55)}
.sq.hint::after{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(17,32,43,.35)}
.sq.hint.cap::after{width:88%;height:88%;background:none;border:4px solid rgba(17,32,43,.4)}
.pc.w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 2px #000}
.pc.b{color:#14202a}
.side{width:min(92vw,300px);display:flex;flex-direction:column;gap:.9rem}
#status{font-family:Georgia,serif;font-size:1.25rem;padding:.9rem 1rem;background:var(--panel);border:1px solid var(--line);border-radius:8px}
#moves{flex:1;min-height:140px;max-height:300px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.7rem 1rem;color:var(--mute);line-height:1.7}
#moves b{color:var(--ink);font-weight:500}
.btns{display:flex;gap:.5rem;flex-wrap:wrap}
.btns button{flex:1}
#err{position:fixed;left:0;right:0;bottom:0;z-index:9;background:#7a1f16;color:#fff;padding:.8rem 1rem;font-size:.95rem}
select{font:inherit;width:100%;padding:.6rem .7rem;border-radius:6px;border:1px solid var(--line);background:#0d1a23;color:var(--ink)}
.bot{display:flex;flex-direction:column;gap:.5rem;padding:.9rem;background:var(--panel);border:1px solid var(--line);border-radius:8px}
#board{position:relative}
.sq.pre{box-shadow:inset 0 0 0 100px rgba(215,40,40,.55)}
.bw{--bs:min(92vw,560px);width:var(--bs)}
.cap{display:flex;align-items:center;flex-wrap:wrap;gap:0;min-height:30px;padding:2px 8px;margin:4px 0;background:#9db3c0;border-radius:4px;font-size:1.25rem;line-height:1.1}
.cap .pc{font-size:1.25rem;margin-right:-4px}
.cap .adv{margin-left:12px;font-family:system-ui,sans-serif;font-size:.9rem;font-weight:700;color:#10202b}
#ov{position:fixed;inset:0;z-index:20;background:rgba(5,12,18,.72);display:grid;place-items:center;padding:1rem}
#ov .box{width:100%;max-width:400px;background:var(--panel);border:2px solid var(--gold);border-radius:12px;padding:1.6rem;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#ov h2{font-size:2rem;margin-bottom:.3rem}
#ov h2.win{color:#5ad28a} #ov h2.loss{color:var(--danger)} #ov h2.draw{color:var(--gold)}
#ov .sub{color:var(--mute);margin:0 0 1.2rem}
#ov .stat{display:flex;justify-content:space-between;gap:1rem;padding:.7rem .9rem;margin-top:.5rem;background:#0d1a23;border:1px solid var(--line);border-radius:8px;font-size:1.05rem}
#ov .stat span{color:var(--mute)}
#ov .pos{color:#5ad28a} #ov .neg{color:var(--danger)}
#ov .note{color:var(--mute);font-size:.85rem;margin:.7rem 0 0}
#ov .btns{margin-top:1.2rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="auth">
  <div class="card">
    <h1>Chess Stack</h1>
    <p>Log in, or create an account with your email.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false">
    <label for="user">Username (only needed when creating an account)</label>
    <input id="user" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label for="pass">Password (6+ characters)</label>
    <input id="pass" type="password" autocomplete="current-password">
    <div class="row">
      <button class="primary" id="btnLogin">Log in</button>
      <button id="btnSignup">Create account</button>
    </div>
    <div id="msg" role="alert"></div>
  </div>
</section>

<section id="app" class="hidden">
  <header>
    <h2>Chess Stack</h2>
    <div class="stats">
      <span><b id="sName">-</b></span>
      <span>Elo <b id="sElo">-</b></span>
      <span>Level <b id="sLvl">-</b></span>
      <span>Balance <b id="sBal">-</b></span>
    </div>
    <button id="btnOut">Log out</button>
  </header>
  <main>
    <div class="bw"><div class="cap" id="capTop"></div><div id="board" aria-label="Chess board"></div><div class="cap" id="capBot"></div></div>
    <div class="side">
      <div class="bot">
        <select id="botSel" aria-label="Choose a bot"></select>
        <select id="colorSel" aria-label="Choose your side">
          <option value="white">Play as White</option>
          <option value="black">Play as Black</option>
          <option value="random">Random side</option>
        </select>
        <div class="btns">
          <button id="btnBot" class="primary">Play bot</button>
          <button id="btnResign">Resign</button>
        </div>
      </div>
      <div id="status"></div>
      <div id="moves"></div>
      <div class="btns">
        <button id="btnNew" class="primary">New game</button>
        <button id="btnUndo">Undo</button>
        <button id="btnFlip">Flip board</button>
      </div>
    </div>
  </main>
</section>

<div id="ov" class="hidden" role="dialog" aria-modal="true">
  <div class="box">
    <h2 id="ovTitle"></h2>
    <p class="sub" id="ovSub"></p>
    <div class="stat"><span>Money</span><b id="ovMoney"></b></div>
    <div class="stat"><span>Elo</span><b id="ovElo"></b></div>
    <p class="note" id="ovNote"></p>
    <div class="btns"><button class="primary" id="ovAgain">Play again</button><button id="ovClose">Close</button></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<div id="err" class="hidden" role="alert"></div>
<script>
function showErr(t){var b=document.getElementById('err');b.textContent='Something broke: '+t;b.classList.remove('hidden');}
window.addEventListener('error',function(e){showErr(e.message||'script failed to load');});
window.addEventListener('unhandledrejection',function(e){showErr((e.reason&&e.reason.message)||e.reason);});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.js"></script>
<script>window.Chess||document.write('<script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.js"><\/script>');</script>
<script>
// ---------- Connection settings (safe to be public) ----------
const SUPABASE_URL = 'https://fjyylqdpxafwvxqcqehb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fZCqxAnTBW3jl3QsqUA7OA_QDssW4Ml';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

// ---------- Accounts ----------
const msg = t => { $('msg').textContent = t; };

async function auth(mode) {
  const email = $('email').value.trim().toLowerCase();
  const u = $('user').value.trim().toLowerCase();
  const p = $('pass').value;
  msg('');
  if (!/^\S+@\S+\.\S+$/.test(email)) return msg('Enter a valid email address.');
  if (p.length < 6) return msg('Password must be at least 6 characters.');
  let r;
  if (mode === 'signup') {
    if (!/^[a-z0-9_]{3,20}$/.test(u)) return msg('Username must be 3–20 letters, numbers or underscores.');
    r = await db.auth.signUp({
      email, password: p,
      options: { data: { username: u }, emailRedirectTo: location.origin + location.pathname }
    });
  } else {
    r = await db.auth.signInWithPassword({ email, password: p });
  }
  if (r.error) {
    const m = r.error.message;
    return msg(/already|registered/i.test(m) ? 'That email is already registered. Try logging in.'
      : /database error/i.test(m) ? 'That username is taken. Pick another.'
      : /not confirmed/i.test(m) ? 'Confirm your email first: open the link we sent you.'
      : /invalid login/i.test(m) ? 'Wrong email or password.'
      : m);
  }
  if (!r.data.session) msg('Account created. Check your email, click the confirmation link, then log in.');
}
$('btnLogin').onclick = () => auth('login');
$('btnSignup').onclick = () => auth('signup');
$('btnOut').onclick = () => db.auth.signOut();
$('pass').addEventListener('keydown', e => { if (e.key === 'Enter') auth('login'); });

async function loadProfile(uid) {
  const { data } = await db.from('profiles').select('username,balance,elo,level,rating_deviation').eq('id', uid).single();
  if (!data) return;
  $('sName').textContent = data.username;
  // A "?" means the rating is still settling (high rating deviation)
  $('sElo').textContent = Math.round(data.elo) + (data.rating_deviation > 110 ? '?' : '');
  $('sLvl').textContent = data.level;
  $('sBal').textContent = Number(data.balance).toFixed(2);
  profElo = Number(data.elo);
}

async function route(session) {
  $('auth').classList.toggle('hidden', !!session);
  $('app').classList.toggle('hidden', !session);
  if (!session) return;
  await loadProfile(session.user.id);
  const r = await db.from('bots').select('*').eq('is_active', true).order('elo');
  bots = r.data || [];
  $('botSel').innerHTML = bots.map(b => '<option value="' + b.id + '">' + b.name + ' (' + b.elo + ')</option>').join('');
  render();
}
db.auth.onAuthStateChange((_e, session) => setTimeout(() => route(session), 0));

// ---------- Chess ----------
if (typeof Chess === 'undefined') throw new Error('The chess library did not load. Check your internet connection or ad blocker.');
const game = new Chess();
let sel = null, legal = [], last = [], flipped = false;
let mode = 'local', myColor = 'w', bots = [], bot = null, botGame = null, thinking = false;
let profElo = null;
let pre = null;                                   // queued premove {from,to}
let arrows = [], marks = [], drawFrom = null, drawTo = null, drawColor = '#2e9e5b';
const SVGNS = 'http://www.w3.org/2000/svg';
const overlay = document.createElementNS(SVGNS, 'svg');
overlay.setAttribute('viewBox', '0 0 8 8');
overlay.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3';
const VAL = { p: 1, n: 3, b: 3, r: 5, q: 9 };
const GLYPH = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };

function kingSquare(color) {
  const rows = game.board();
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const p = rows[r][c];
    if (p && p.type === 'k' && p.color === color) return 'abcdefgh'[c] + (8 - r);
  }
}

function render() {
  const b = $('board');
  b.innerHTML = '';
  const order = [0, 1, 2, 3, 4, 5, 6, 7];
  if (flipped) order.reverse();
  const rows = game.board();
  const checked = game.in_check() ? kingSquare(game.turn()) : null;
  for (const r of order) for (const c of order) {
    const name = 'abcdefgh'[c] + (8 - r);
    const p = rows[r][c];
    const d = document.createElement('div');
    d.className = 'sq ' + ((r + c) % 2 === 0 ? 'l' : 'd');
    d.dataset.sq = name;
    if (last.includes(name)) d.classList.add('last');
    if (name === sel) d.classList.add('sel');
    if (name === checked) d.classList.add('chk');
    if (pre && (name === pre.from || name === pre.to)) d.classList.add('pre');
    const mv = legal.find(m => m.to === name);
    if (mv) d.classList.add('hint', ...(p ? ['cap'] : []));
    if (p) {
      const s = document.createElement('span');
      s.className = 'pc ' + p.color;
      s.textContent = GLYPH[p.type] + '\uFE0E';
      d.appendChild(s);
    }
    b.appendChild(d);
  }
  b.appendChild(overlay);
  drawOverlay();
  renderMaterial();
  renderStatus();
}

function renderStatus() {
  const side = game.turn() === 'w' ? 'White' : 'Black';
  let t;
  if (game.in_checkmate()) t = 'Checkmate. ' + (side === 'White' ? 'Black' : 'White') + ' wins.';
  else if (game.in_stalemate()) t = 'Draw by stalemate.';
  else if (game.in_threefold_repetition()) t = 'Draw by repetition.';
  else if (game.insufficient_material()) t = 'Draw: not enough pieces.';
  else if (game.in_draw()) t = 'Draw.';
  else t = side + ' to move' + (game.in_check() ? ' (check)' : '');
  if (mode === 'bot' && !game.game_over()) t = (thinking ? bot.name + ' is thinking...' : 'Your move') + (game.in_check() && !thinking ? ' (check)' : '');
  $('status').textContent = t;
  const h = game.history();
  let html = '';
  for (let i = 0; i < h.length; i += 2) {
    html += (i / 2 + 1) + '. <b>' + h[i] + '</b> ' + (h[i + 1] ? '<b>' + h[i + 1] + '</b>' : '') + '<br>';
  }
  $('moves').innerHTML = html || 'Moves will appear here.';
  $('moves').scrollTop = 1e6;
}

// ----- captured pieces + material advantage -----
function renderMaterial() {
  const capBy = { w: [], b: [] };
  for (const m of game.history({ verbose: true })) if (m.captured) capBy[m.color].push(m.captured);
  let w = 0, bl = 0;
  for (const row of game.board()) for (const p of row) {
    if (p && p.type !== 'k') { if (p.color === 'w') w += VAL[p.type]; else bl += VAL[p.type]; }
  }
  const diff = w - bl;
  const bottom = flipped ? 'b' : 'w', top = bottom === 'w' ? 'b' : 'w';
  fillCap('capBot', bottom, capBy[bottom], bottom === 'w' ? diff : -diff);
  fillCap('capTop', top, capBy[top], top === 'w' ? diff : -diff);
}
function fillCap(id, color, list, adv) {
  const opp = color === 'w' ? 'b' : 'w';
  list.sort((a, b) => VAL[b] - VAL[a]);
  $(id).innerHTML = list.map(t => '<span class="pc ' + opp + '">' + GLYPH[t] + '\uFE0E</span>').join('') +
    (adv > 0 ? '<span class="adv">+' + adv + '</span>' : '');
}

// ----- right-click arrows and highlights -----
function xy(sq) {
  let c = 'abcdefgh'.indexOf(sq[0]), r = 8 - Number(sq[1]);
  if (flipped) { c = 7 - c; r = 7 - r; }
  return [c + 0.5, r + 0.5];
}
function arrowSvg(a) {
  const [x1, y1] = xy(a.from), [x2, y2] = xy(a.to);
  const len = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / len, uy = (y2 - y1) / len;
  const sx = x1 + ux * 0.3, sy = y1 + uy * 0.3;
  const tx = x2 - ux * 0.08, ty = y2 - uy * 0.08;
  const bx = tx - ux * 0.32, by = ty - uy * 0.32;
  const px = -uy * 0.18, py = ux * 0.18;
  return '<line x1="' + sx + '" y1="' + sy + '" x2="' + bx + '" y2="' + by + '" stroke="' + a.color + '" stroke-width="0.15" stroke-linecap="round" opacity="0.85"/>' +
    '<polygon points="' + tx + ',' + ty + ' ' + (bx + px) + ',' + (by + py) + ' ' + (bx - px) + ',' + (by - py) + '" fill="' + a.color + '" opacity="0.85"/>';
}
function drawOverlay() {
  let h = '';
  for (const m of marks) {
    const [x, y] = xy(m.sq);
    h += '<circle cx="' + x + '" cy="' + y + '" r="0.44" fill="none" stroke="' + m.color + '" stroke-width="0.07" opacity="0.9"/>';
  }
  const list = arrows.slice();
  if (drawFrom && drawTo && drawTo !== drawFrom) list.push({ from: drawFrom, to: drawTo, color: drawColor });
  for (const a of list) h += arrowSvg(a);
  overlay.innerHTML = h;
}
function clearDrawings() { if (arrows.length || marks.length) { arrows = []; marks = []; drawOverlay(); } }
function pickColor(e) { return e.shiftKey ? '#e0463a' : (e.ctrlKey || e.altKey || e.metaKey) ? '#3b82d9' : '#2e9e5b'; }
$('board').addEventListener('contextmenu', e => e.preventDefault());
$('board').addEventListener('mousedown', e => {
  if (e.button !== 2) return;
  const el = e.target.closest('.sq'); if (!el) return;
  drawFrom = el.dataset.sq; drawTo = null; drawColor = pickColor(e);
});
$('board').addEventListener('mousemove', e => {
  if (!drawFrom) return;
  const el = e.target.closest('.sq'), t = el ? el.dataset.sq : null;
  if (t !== drawTo) { drawTo = t; drawOverlay(); }
});
window.addEventListener('mouseup', e => {
  if (e.button !== 2 || !drawFrom) return;
  const hit = document.elementFromPoint(e.clientX, e.clientY);
  const sqEl = hit && hit.closest ? hit.closest('.sq') : null;
  const to = sqEl ? sqEl.dataset.sq : null;
  if (to === drawFrom) {
    const i = marks.findIndex(m => m.sq === to && m.color === drawColor);
    if (i >= 0) marks.splice(i, 1); else marks.push({ sq: to, color: drawColor });
  } else if (to) {
    const i = arrows.findIndex(a => a.from === drawFrom && a.to === to);
    if (i >= 0) arrows.splice(i, 1); else arrows.push({ from: drawFrom, to, color: drawColor });
  }
  drawFrom = null; drawTo = null; drawOverlay();
});

// ----- premoves -----
function hypoMoves(sq) {
  // what could my piece do if it were my turn right now (used for premoves)
  const parts = game.fen().split(' ');
  parts[1] = myColor; parts[3] = '-';
  return new Chess(parts.join(' ')).moves({ square: sq, verbose: true });
}
function premoveClick(sq) {
  if (pre) { pre = null; sel = null; legal = []; render(); return; }   // any click cancels
  if (sel && legal.find(m => m.to === sq)) { pre = { from: sel, to: sq }; sel = null; legal = []; render(); return; }
  const p = game.get(sq);
  if (p && p.color === myColor) { sel = sq; legal = hypoMoves(sq); } else { sel = null; legal = []; }
  render();
}
function playPremove() {
  const pm = pre; pre = null;
  if (!pm) return false;
  const ok = game.moves({ square: pm.from, verbose: true }).find(m => m.to === pm.to);
  if (!ok) return false;                                              // no longer legal: dropped
  game.move({ from: pm.from, to: pm.to, promotion: 'q' });
  last = [pm.from, pm.to];
  return true;
}

// ----- game over box -----
function showResult(i) {
  const win = i.result === 'win', draw = i.result === 'draw';
  let title;
  if (i.reason === 'Checkmate') title = win ? 'Checkmate! You win!' : 'Checkmate. You lose.';
  else if (i.reason === 'You resigned') title = 'You resigned';
  else title = win ? 'You win!' : draw ? 'Draw' : 'You lose';
  $('ovTitle').textContent = title;
  $('ovTitle').className = win ? 'win' : draw ? 'draw' : 'loss';
  const parts = ['vs ' + (bot ? bot.name : 'bot')];
  if (i.reason !== 'Checkmate' && i.reason !== 'You resigned') parts.push(i.reason);
  parts.push(Math.ceil(i.plies / 2) + ' moves');
  $('ovSub').textContent = parts.join(' · ');
  if (i.error || i.reward == null) {
    $('ovMoney').textContent = '-'; $('ovElo').textContent = '-';
    $('ovNote').textContent = 'The result could not be saved.';
  } else {
    $('ovMoney').textContent = '+$' + Number(i.reward).toFixed(2);
    $('ovMoney').className = Number(i.reward) > 0 ? 'pos' : '';
    if (i.before != null && i.after != null) {
      const d = Number(i.after) - Number(i.before);
      $('ovElo').innerHTML = Math.round(i.before) + ' → ' + Math.round(i.after) + ' <span class="' + (d >= 0 ? 'pos' : 'neg') + '">(' + (d >= 0 ? '+' : '') + d.toFixed(1) + ')</span>';
    } else $('ovElo').textContent = Math.round(i.after);
    $('ovNote').textContent = (i.result === 'loss' && Number(i.reward) === 0) ? 'Losses only pay money after 25 moves.' : '';
  }
  $('ov').classList.remove('hidden');
}
$('ovClose').onclick = () => $('ov').classList.add('hidden');
$('ov').addEventListener('click', e => { if (e.target === $('ov')) $('ov').classList.add('hidden'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('ov').classList.add('hidden'); });
$('ovAgain').onclick = () => { $('ov').classList.add('hidden'); $('btnBot').click(); };

$('board').addEventListener('click', e => {
  clearDrawings();                       // left click removes arrows and highlights
  const el = e.target.closest('.sq');
  if (!el || game.game_over()) return;
  const sq = el.dataset.sq;
  if (mode === 'bot' && botGame && game.turn() !== myColor) { premoveClick(sq); return; }
  if (mode === 'bot' && thinking) return;
  const target = legal.find(m => m.to === sq);
  let moved = false;
  if (sel && target) {
    game.move({ from: sel, to: sq, promotion: 'q' }); // pawns promote to a queen for now
    last = [sel, sq]; sel = null; legal = []; moved = true;
  } else {
    const p = game.get(sq);
    if (p && p.color === game.turn()) { sel = sq; legal = game.moves({ square: sq, verbose: true }); }
    else { sel = null; legal = []; }
  }
  render();
  if (moved) afterMove();
});

$('btnNew').onclick = async () => {
  if (mode === 'bot' && botGame && !game.game_over()) {
    if (!confirm('Leaving this bot game counts as a loss. Continue?')) return;
    await finish('loss', 'You left the game', true);
  }
  pre = null; clearDrawings(); $('ov').classList.add('hidden');
  mode = 'local'; flipped = false; game.reset(); sel = null; legal = []; last = []; render();
};
$('btnUndo').onclick = () => { if (mode === 'bot') return; game.undo(); sel = null; legal = []; last = []; render(); };
$('btnFlip').onclick = () => { flipped = !flipped; render(); };

// ---------- Stockfish (runs in the browser; files live in the /stockfish folder) ----------
const SF_PATH = 'stockfish/stockfish-19-lite-single.js';
const SF_WASM = SF_PATH.replace(/\.js$/, '.wasm');
let engineP = null;
async function checkFile(p) {
  const url = new URL(p, location.href).href;
  try {
    const r = await fetch(url, { method: 'HEAD', cache: 'no-store' });
    return r.ok ? null : 'the site answered "' + r.status + ' not found" for ' + url;
  } catch (e) { return 'could not reach ' + url; }
}
function startEngine() {
  if (!engineP) engineP = (async () => {
    const bad = (await checkFile(SF_PATH)) || (await checkFile(SF_WASM));
    if (bad) throw new Error('Stockfish file problem: ' + bad + '. The file name and folder must match exactly (capital letters count).');
    return new Promise((res, rej) => {
      const w = new Worker(SF_PATH);
      const timer = setTimeout(() => rej(new Error('Stockfish took too long to start.')), 20000);
      w.onerror = ev => { clearTimeout(timer); rej(new Error('Stockfish found but failed to start: ' + (ev.message || 'unknown error'))); };
      w.onmessage = e => { const t = String(e.data); if (t === 'uciok') w.postMessage('isready'); if (t === 'readyok') { clearTimeout(timer); res(w); } };
      w.postMessage('uci');
    });
  })().catch(err => { engineP = null; throw err; });
  return engineP;
}
async function engineMove(fen, b) {
  const w = await startEngine();
  return new Promise(resolve => {
    w.onmessage = e => { const m = /^bestmove (\S+)/.exec(String(e.data)); if (m) resolve(m[1]); };
    const weak = b.elo < 1200;
    w.postMessage('setoption name Skill Level value ' + (weak ? 0 : b.skill_level));
    w.postMessage('position fen ' + fen);
    w.postMessage('go depth ' + (weak ? 1 : b.depth) + ' movetime ' + (weak ? 50 : b.movetime_ms));
  });
}

// ---------- Bot games ----------
async function botTurn() {
  const gid = botGame;
  thinking = true; renderStatus();
  try {
    // wait a human-like 1-3 seconds so the bot doesn't answer instantly
    const waitMs = 1000 + Math.random() * 2000;
    let [uci] = await Promise.all([engineMove(game.fen(), bot), new Promise(r => setTimeout(r, waitMs))]);
    if (botGame !== gid) { thinking = false; return; }
    // low-rated bots sometimes just play a random legal move (the lower the rating, the more often)
    if (bot.elo < 1200 && Math.random() < (1200 - bot.elo) / 1200 * 0.95) {
      const all = game.moves({ verbose: true });
      const m = all[Math.floor(Math.random() * all.length)];
      uci = m.from + m.to + (m.promotion || '');
    }
    game.move({ from: uci.slice(0, 2), to: uci.slice(2, 4), promotion: uci[4] });
    last = [uci.slice(0, 2), uci.slice(2, 4)];
    sel = null; legal = [];
    if (pre && !game.game_over()) playPremove(); else pre = null;
  } catch (err) { showErr(err.message); }
  thinking = false; render(); afterMove();
}

async function afterMove() {
  if (mode !== 'bot' || !botGame) return;
  if (game.game_over()) await finish();
  else if (game.turn() !== myColor) botTurn();
}

async function finish(result, reason, quiet) {
  const id = botGame; if (!id) return;
  botGame = null; pre = null;
  if (!result) result = game.in_checkmate() ? (game.turn() === myColor ? 'loss' : 'win') : 'draw';
  if (!reason) reason = game.in_checkmate() ? 'Checkmate' : game.in_stalemate() ? 'Stalemate' : game.in_threefold_repetition() ? 'Draw by repetition' : game.insufficient_material() ? 'Not enough pieces' : 'Draw';
  const plies = game.history().length, before = profElo;
  const { data, error } = await db.rpc('finish_bot_game', { p_game_id: id, p_result: result, p_plies: plies });
  if (error) showErr(error.message);
  const after = data && data.elo != null ? Number(data.elo) : null;
  if (after != null) profElo = after;
  const ses = await db.auth.getSession();
  if (ses.data.session) loadProfile(ses.data.session.user.id);
  if (!quiet) showResult({ result, reason, plies, reward: data ? data.reward : null, before, after, error: !!error });
}

$('btnBot').onclick = async () => {
  const b = bots.find(x => x.id === $('botSel').value);
  if (!b) return;
  let c = $('colorSel').value;
  if (c === 'random') c = Math.random() < 0.5 ? 'white' : 'black';
  const { data, error } = await db.rpc('start_bot_game', { p_bot_id: b.id, p_color: c });
  if (error) return showErr(error.message);
  game.reset(); sel = null; legal = []; last = []; pre = null; clearDrawings(); $('ov').classList.add('hidden');
  mode = 'bot'; bot = b; botGame = data; myColor = c === 'white' ? 'w' : 'b'; flipped = c === 'black';
  render();
  if (game.turn() !== myColor) botTurn();
};

$('btnResign').onclick = async () => {
  if (mode !== 'bot' || !botGame || game.game_over()) return;
  const early = game.history().length < 50;
  if (!confirm('Resign this game? It counts as a loss.' + (early ? ' Resigning before move 25 earns no money.' : ''))) return;
  await finish('loss', 'You resigned');
  mode = 'local'; render();
  $('status').textContent = 'You resigned.';
};
